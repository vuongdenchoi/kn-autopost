name: KN IB HUB Auto Post

on:
  schedule:
    - cron: "0 1 * * *"    # 08:00 giờ Việt Nam
    - cron: "0 13 * * *"   # 20:00 giờ Việt Nam
  workflow_dispatch:        # bấm "Run workflow" để đăng thủ công

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: pip install -r requirements.txt
      - name: Tải font tiếng Việt
        run: |
          mkdir -p fonts
          for w in ExtraBold Bold Medium Regular; do
            curl -sL -o fonts/BeVietnamPro-$w.ttf https://github.com/google/fonts/raw/main/ofl/bevietnampro/BeVietnamPro-$w.ttf
          done
      - name: Đăng bài
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTS_PER_RUN: "1"
        run: python main.py
      - name: Lưu danh sách tin đã đăng (chống trùng)
        run: |
          git config user.name "kn-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.json
          git commit -m "update posted" || echo "no changes"
          git push
